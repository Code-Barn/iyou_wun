{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}iyou_wun{% endblock %}</title>
    <script>
      (function() {
        const cookieMatch = document.cookie.match(/(?:^|; )wun_theme=([^;]*)/);
        const theme = cookieMatch ? decodeURIComponent(cookieMatch[1]) : (localStorage.getItem('wun_theme') || 'light');
        if (theme === 'dark' || theme === 'stealth') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col transition-colors duration-200 bg-slate-50 text-slate-900 dark:bg-[#0B0F19] dark:text-gray-200">
    {% include "includes/_ecosystem_bar.html" %}
    {% include "includes/_standard_header.html" %}
    {% include "_nav.html" %}

    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    {% block extra_body %}{% endblock %}
    <script src="{% static 'js/theme.js' %}"></script>
    <script src="{% static 'js/contact_manager.js' %}" defer></script>
    <script src="{% static 'js/circle_feed_filter.js' %}" defer></script>
</body>


</html>
