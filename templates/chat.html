<!doctype html>
<html>
<head>
    <title>Chat - iyou_wun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    screens: { xs: '360px' }
                }
            }
        }
    </script>
    <link rel="stylesheet" type="text/css" href="https://cdn.conversejs.org/dist/converse.min.css">
    <style>
        #conversejs { height: calc(100vh - 57px); }
        .converse-chatrooms, .converse-chatboxes { max-width: 100% !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    {% include 'includes/_ecosystem_bar.html' %}
    {% include 'includes/_standard_header.html' %}
    {% include '_nav.html' %}
    <div id="conversejs"></div>
    <script src="https://cdn.conversejs.org/dist/converse.min.js"></script>
    <script>
        converse.initialize({
            bosh_service_url: undefined,
            websocket_url: '{{ xmpp_ws_url }}',
            jid: '{{ user_pubkey }}@{{ xmpp_domain }}',
            password: '{{ xmpp_password }}',
            authentication: 'login',
            keepalive: false,
            persistent_store: 'session',
            view_mode: 'fullscreen',
            auto_login: true,
            allow_registration: false,
            discover_connection_methods: false,
            theme: 'light',
            show_controlbox_by_default: true,
            hide_muc_panel: true,
            allow_logout: false,
            sticky_controlbox: true,
        });
    </script>
</body>
</html>
