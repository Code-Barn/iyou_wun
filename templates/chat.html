{% extends "base.html" %}
{% load static %}

{% block title %}Chat - iyou_wun{% endblock %}

{% block extra_head %}
<!-- Converse.js CSS -->
<link rel="stylesheet" href="https://cdn.conversejs.org/dist/converse.min.css">
<style>
  /* Prevent Converse CSS from blowing out theme typography */
  #conversejs-wrap {
    height: calc(100vh - 145px);
  }
  #conversejs .converse-chatbox, #conversejs .converse-controlbox {
    font-family: inherit;
  }
  .dark #conversejs, .dark #conversejs .converse-chatbox, .dark #conversejs .converse-controlbox {
    background-color: #0f172a !important;
    border-color: #1e293b !important;
  }
</style>
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-2 sm:px-4 py-2">
  <!-- Loading Spinner Overlay -->
  <div id="chat-loading-overlay" class="flex flex-col items-center justify-center h-[calc(100vh-180px)] bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm rounded-xl border border-slate-200 dark:border-slate-800">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-violet-600 dark:border-violet-400"></div>
    <p class="mt-3 text-xs font-mono text-slate-500 dark:text-slate-400">Authenticating with sovereign XMPP mesh...</p>
  </div>

  <!-- Embedded Converse.js Container -->
  <div id="conversejs-wrap" class="hidden rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm">
    <div id="conversejs"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  window.peerTarget = "{{ peer_target|default:'' }}";
</script>
<script type="module">
  import converse from 'https://cdn.conversejs.org/10.1.7/dist/converse.min.js';

  document.addEventListener("DOMContentLoaded", function() {
    const wsUrl = "{{ xmpp_ws_url|default:'wss://wun.iyou.me/xmpp-websocket' }}";
    const jid = "{{ user_jid|default:'' }}";
    const password = "{{ xmpp_token|default:'' }}";
    const xmppDomain = "{{ xmpp_domain|default:'iyou.me' }}";

    function dismissLoadingSpinner() {
      const loader = document.getElementById('chat-loading-overlay');
      const wrap = document.getElementById('conversejs-wrap');
      if (loader) loader.classList.add('hidden');
      if (wrap) wrap.classList.remove('hidden');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const peerParam = window.peerTarget || urlParams.get('peer');
    const autoJoinChats = peerParam ? [peerParam.includes('@') ? peerParam : `${peerParam}@${xmppDomain}`] : [];

    // Register lifecycle plugin for clean event hooks
    converse.plugins.add('iyou-lifecycle', {
      initialize: function () {
        const _converse = this._converse;
        _converse.api.listen.on('connected', dismissLoadingSpinner);
        _converse.api.listen.on('statusInitialized', dismissLoadingSpinner);
      }
    });

    if (peerParam) {
      converse.plugins.add('auto-open-peer', {
        initialize: function () {
          const _converse = this._converse;
          const targetJid = peerParam.includes('@') ? peerParam : `${peerParam}@${xmppDomain}`;
          _converse.api.waitUntil('chatsInitialized').then(() => {
            _converse.api.chats.open(targetJid);
          });
        }
      });
    }

    try {
      converse.initialize({
        bosh_service_url: undefined,
        websocket_url: wsUrl || undefined,
        authentication: jid ? 'login' : 'anonymous',
        jid: jid || undefined,
        password: password || undefined,
        view_mode: 'embedded',
        root: document.getElementById('conversejs'),
        show_controlbox_by_default: true,
        discover_connection_methods: false,
        allow_non_roster_messaging: true,
        allow_muc: true,
        allow_registration: false,
        auto_away: 0,
        auto_reconnect: true,
        keepalive: true,
        persistent_store: 'local',
        singleton: false,
        auto_join_private_chats: autoJoinChats,
        theme: document.documentElement.classList.contains('dark') ? 'dracula' : 'concord',
        whitelisted_plugins: peerParam ? ['iyou-lifecycle', 'auto-open-peer'] : ['iyou-lifecycle']
      }).then(function() {
        // Fallback safety unhide after promise resolves
        setTimeout(dismissLoadingSpinner, 1000);
      }).catch(function(err) {
        console.error("Converse initialize error:", err);
        dismissLoadingSpinner();
      });
    } catch (err) {
      console.error("Converse bootstrap error:", err);
      dismissLoadingSpinner();
    }
  });
</script>
{% endblock %}
