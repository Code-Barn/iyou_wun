<!--
  _live_audio_tray.html — Persistent Floating Audio Tray (NIP-53 Kind 30311).

  Mounted directly in base.html (above the floating chat root) so it survives
  route changes. Hidden until a Live Room is "tuned in" from the right-rail
  discovery widget (or via window.LiveAudioTray.attach for compat callers).

  DOM contract consumed by static/js/live_audio_player.js:
    window.liveAudioPlayer.tuneIn(roomOrButton)
    window.liveAudioPlayer.togglePlay() / setVolume(v) / toggleMinimize()
    window.liveAudioPlayer.disconnect()
    #live-audio-tray     root (hidden until attach)
    #live-audio-element  native <audio> transport
    #audio-tray-*        title / host / listeners / play / pause / volume controls
-->
{% load static %}
<div id="live-audio-tray"
     class="hidden fixed bottom-4 right-4 z-40 w-80 sm:w-96 rounded-2xl bg-white/95 dark:bg-[#0B0F19]/95 backdrop-blur-md border border-slate-200 dark:border-slate-800 shadow-2xl p-3 font-mono text-xs transition-all duration-300">
  <div class="flex items-center justify-between pb-2 border-b border-slate-100 dark:border-slate-800">
    <div class="flex items-center gap-2 min-w-0">
      <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse shrink-0"></span>
      <span id="audio-tray-title" class="font-bold text-slate-900 dark:text-slate-100 truncate text-xs">Audio Space</span>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <button type="button"
              id="audio-tray-minimize-btn"
              onclick="window.liveAudioPlayer && window.liveAudioPlayer.toggleMinimize()"
              class="p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded"
              title="Minimize">
        <svg class="w-3.5 h-3.5 stroke-current stroke-2" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15"/></svg>
      </button>
      <button type="button"
              onclick="window.liveAudioPlayer && window.liveAudioPlayer.disconnect()"
              class="p-1 text-slate-400 hover:text-rose-500 rounded"
              title="Leave Space">
        <svg class="w-3.5 h-3.5 stroke-current stroke-2" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- Active Stream Controls -->
  <div id="audio-tray-body" class="pt-2 space-y-2">
    <div class="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400">
      <span id="audio-tray-host" class="truncate">Connecting to stream...</span>
      <span id="audio-tray-listeners" class="shrink-0 text-violet-500"></span>
    </div>

    <div class="flex items-center justify-between gap-3 pt-1">
      <button type="button"
              id="audio-tray-play-btn"
              onclick="window.liveAudioPlayer && window.liveAudioPlayer.togglePlay()"
              class="flex items-center justify-center w-8 h-8 rounded-full bg-violet-600 hover:bg-violet-700 text-white transition shrink-0 shadow-sm">
        <svg id="audio-tray-play-icon" class="w-4 h-4 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="audio-tray-pause-icon" class="w-4 h-4 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <!-- Volume Slider -->
      <div class="flex items-center gap-1.5 flex-1">
        <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range"
               id="audio-tray-volume"
               min="0" max="1" step="0.05" value="1"
               oninput="window.liveAudioPlayer && window.liveAudioPlayer.setVolume(this.value)"
               class="w-full h-1 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-violet-600" />
      </div>
    </div>
    <audio id="live-audio-element" preload="none" class="hidden"></audio>
  </div>
</div>
