<!-- Tailwind Safe Initialization - Prevents "Can't find variable: tailwind" errors -->
<script>
// Prevent script execution crashes if runtime tailwind variables are unresolved
if (typeof tailwind !== 'undefined') {
    tailwind.config = { 
        theme: { 
            extend: { 
                colors: { 
                    // App accent color for dynamic theming
                    'accent': 'var(--color-accent)'
                } 
            } 
        } 
    };
}
</script>
<style>
    :root {
        --color-accent: #7c3aed;
    }
</style>
