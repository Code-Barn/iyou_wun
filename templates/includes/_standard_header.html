{% load static %}
<script>
  window.CURRENT_SESSION_DID = "{% firstof current_session_did user.username '' as session_did %}{{ session_did|escapejs }}";
  if (!window.__meshProfileSyncBound) {
    window.__meshProfileSyncBound = true;
    window.addEventListener("meshProfileSync", function(e) {
      var p = e.detail;
      if (!p) return;
      var h = document.querySelectorAll(".mesh-user-handle");
      h.forEach(function(el) {
        if (p.handle) {
          el.textContent = "@" + String(p.handle).replace(/^@/, "");
        }
      });
      var a = document.querySelectorAll(".mesh-user-avatar");
      a.forEach(function(el) {
        if (p.avatar_url) {
          el.src = p.avatar_url;
          el.classList.remove("hidden");
        }
      });
    });
  }
</script>
<header class="relative z-30 border-b backdrop-blur-sm transition-colors duration-200 bg-white/90 border-slate-200 text-slate-900 dark:bg-[#0B0F19]/90 dark:border-gray-800 dark:text-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 py-3.5 min-h-[64px] flex items-center justify-between" style="min-height: 64px;">

    <!-- Left: Brand Lockup & Sibling Domain Badge -->
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-2 text-2xl font-bold tracking-tight hover:opacity-90 transition-opacity" title="iyou_wun">
        <img
          src="{% static 'img/logo_square_sm.png' %}"
          onerror="this.onerror=null;this.src='{% static 'img/logo_square.png' %}';"
          alt="wun"
          class="h-8 w-8 aspect-square rounded-lg object-contain shadow-sm border border-slate-200 dark:border-slate-800 group-hover:scale-105 transition-transform duration-150"
        />
        <span class="flex items-center"><span class="text-slate-400 dark:text-slate-500 font-medium">iyou</span><span class="text-violet-600 dark:text-violet-400 font-extrabold">_wun</span></span>
      </a>
      <span class="hidden sm:inline-block px-2 py-0.5 rounded text-[10px] font-mono uppercase tracking-wider bg-slate-100 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700/60">
        SOCIAL HUB
      </span>
    </div>

    <!-- Right: Identity & Utility Controls -->
    <div class="flex items-center gap-4">
      {% if user.is_authenticated or request.user.is_authenticated %}
        <!-- Notification Bell -->
        <button id="notification-bell-btn" type="button" class="relative p-1.5 text-slate-500 dark:text-slate-400 hover:text-violet-600 dark:hover:text-violet-400 transition rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800/60 focus:outline-none" onclick="typeof toggleNotificationDrawer === 'function' && toggleNotificationDrawer()" title="Activity Notifications">
          <span class="text-sm">🔔</span>
          <span id="notification-unread-dot" class="hidden absolute top-1 right-1 w-2 h-2 bg-violet-500 rounded-full animate-pulse"></span>
        </button>

        <!-- Persona Enclave Partial -->
        {% include "includes/_persona_enclave.html" %}

        <!-- Direct Actions -->
        <a href="{% url 'dashboard' %}" class="text-xs text-slate-400 hover:text-violet-500 dark:hover:text-violet-400 hidden sm:inline transition font-mono" title="Edit Profile & Settings">
          [ ⚙️ Edit ]
        </a>
        <a href="{% url 'oidc_logout' %}" class="text-xs font-mono text-slate-400 hover:text-rose-400 transition ml-1">
          Sign Out
        </a>
      {% else %}
        <!-- Logged-Out Block: Live Poly Structure -->
        <div class="flex items-center gap-2 text-xs">
          <div class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-amber-500/20 bg-amber-50/50 dark:bg-amber-950/20 text-amber-800 dark:text-amber-300">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0"></span>
            <span class="italic text-xs text-slate-600 dark:text-slate-400">Sovereign Key Required</span>
          </div>
          <a href="{% url 'oidc_authentication_init' %}" class="px-3 py-1.5 rounded-lg bg-violet-600 hover:bg-violet-700 text-white font-medium text-xs shadow-sm transition-all flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
            </svg>
            <span>Authenticate</span>
          </a>
        </div>
      {% endif %}

      <!-- Grey Outline Theme Switcher (Strictly Neutral Slate) -->
      <button id="theme-toggle" type="button" class="p-2 rounded-lg text-slate-400 hover:text-slate-600 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800/80 transition-colors focus:outline-none" aria-label="Toggle theme">
        <svg id="icon-sun" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg id="icon-moon" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
    </div>

  </div>
</header>
