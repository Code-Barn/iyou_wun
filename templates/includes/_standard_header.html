{% load static %}
<script>
  window.CURRENT_SESSION_DID = "{{ current_session_did|escapejs }}";
</script>
<header class="border-b backdrop-blur-sm transition-colors duration-200 bg-white/90 border-slate-200 text-slate-900 dark:bg-[#0B0F19]/90 dark:border-gray-800 dark:text-gray-100">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
    
    <a href="/" class="flex items-center gap-2 group transition-transform active:scale-95">
      <span class="text-xl font-bold tracking-tight">
        <span class="text-slate-400 dark:text-gray-400 group-hover:text-slate-600 dark:group-hover:text-gray-200 transition-colors">iyou</span><span class="text-violet-400">_wun</span>
      </span>
    </a>

    <div class="flex items-center gap-4">
      {% if user.is_authenticated or request.user.is_authenticated %}
        <!-- Layer 1 Notification Trigger -->
        <button id="notification-bell-btn"
                type="button"
                class="relative p-1.5 text-slate-500 dark:text-slate-400 hover:text-violet-600 dark:hover:text-violet-400 transition rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800/60 focus:outline-none"
                onclick="toggleNotificationDrawer()"
                title="Activity Notifications">
          <span class="text-sm">🔔</span>
          <!-- Unread Badge Ping -->
          <span id="notification-unread-dot" class="hidden absolute top-1 right-1 w-2 h-2 bg-violet-500 rounded-full animate-pulse"></span>
        </button>
        <div class="flex items-center gap-2 font-mono">
          <!-- Persona Quick-Switcher Container -->
          <div class="relative inline-block text-left" id="persona-switcher-container">
            <!-- Active Persona Trigger Button -->
            <button 
              type="button" 
              id="persona-switcher-btn"
              class="flex items-center gap-2 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-900/80 hover:bg-slate-100 dark:hover:bg-slate-800 transition text-xs font-mono focus:outline-none"
              aria-expanded="false"
              aria-haspopup="true"
              onclick="togglePersonaDropdown()"
            >
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse inline-block" id="active-persona-dot" title="Sovereign Key Active"></span>
              <span id="active-persona-display-name" class="truncate max-w-[140px] font-mono text-xs font-medium text-slate-700 dark:text-slate-200">
                {{ user_display_label }}
              </span>
              <span class="text-[10px] px-1 py-0.5 rounded bg-violet-100 dark:bg-violet-950/80 text-violet-700 dark:text-violet-300 font-bold" id="active-persona-level">
                L1
              </span>
              <svg class="w-3.5 h-3.5 text-slate-400 transition-transform duration-200" id="persona-chevron" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <!-- Flyout Menu -->
            <div 
              id="persona-switcher-dropdown" 
              class="hidden absolute right-0 mt-1.5 w-72 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl z-50 p-1.5 text-xs font-mono divide-y divide-slate-100 dark:divide-slate-800"
            >
              <div class="px-2 py-1.5 text-[10px] uppercase font-bold text-slate-400 tracking-wider flex items-center justify-between">
                <span>Active Enclave Personas</span>
                <span id="persona-bridge-status" class="text-emerald-500 font-normal">Bridge Connected</span>
              </div>

              <!-- Persona List Target Container -->
              <div class="py-1 space-y-1" id="persona-list-container">
                <div class="px-2 py-2 text-slate-400 text-center text-[11px] animate-pulse">
                  Querying local vault personas...
                </div>
              </div>

              <!-- Enclave Shortcut Footer -->
              <div class="pt-1.5 pb-0.5 px-2 flex items-center justify-between text-[11px] text-slate-400">
                <span class="truncate">Manage in iyou_home</span>
                <span class="text-violet-500">🔒 Enclave</span>
              </div>
            </div>
          </div>

          <a href="{% url 'dashboard' %}" class="text-xs text-slate-400 hover:text-violet-400 hidden sm:inline transition" title="Edit Profile & Settings">
            [ ⚙️ Edit ]
          </a>
          <a href="{% url 'oidc_logout' %}" class="text-xs text-slate-400 hover:text-rose-400 transition ml-1">Sign Out</a>
        </div>
      {% else %}
        <a href="{% url 'oidc_authentication_init' %}" class="text-xs uppercase tracking-wider font-semibold text-violet-600 hover:text-violet-500 dark:text-violet-400 transition-colors">
          Sign In
        </a>
      {% endif %}


      <button id="theme-toggle" type="button" class="text-slate-400 hover:text-violet-400 dark:text-gray-400 dark:hover:text-violet-400 transition focus:outline-none" aria-label="Toggle theme">
        <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg id="icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
    </div>

  </div>
</header>
