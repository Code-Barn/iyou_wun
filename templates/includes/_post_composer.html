{% if user_pubkey %}
<div class="border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 rounded-xl p-5 shadow-sm">
    <h2 class="text-sm font-semibold text-slate-800 dark:text-slate-200 mb-3 font-mono">Post to Nostr</h2>
    <textarea id="postContent" class="w-full border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 rounded-lg p-3 text-xs text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition resize-none" rows="3" placeholder="What's on your mind?"></textarea>
    <div class="mt-3 flex items-center gap-3 justify-between">
        <div class="flex items-center gap-2">
            <input type="file" id="mediaInput" class="hidden" accept="image/*,video/*,audio/*" onchange="handleMediaSelected(this.files[0])" />
            <button type="button" id="uploadButton" onclick="document.getElementById('mediaInput').click()" class="text-xs text-violet-600 dark:text-violet-400 hover:text-violet-700 font-medium flex items-center gap-1 px-3 py-1.5 border border-violet-200 dark:border-violet-800 rounded-lg hover:bg-violet-50 dark:hover:bg-violet-950/40 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Upload Media
            </button>
            <span id="uploadStatus" class="text-xs text-slate-500 hidden"></span>
            <button type="button" onclick="openPollModal()" class="text-xs text-amber-600 dark:text-amber-400 hover:text-amber-700 font-medium flex items-center gap-1 px-3 py-1.5 border border-amber-200 dark:border-amber-800 rounded-lg hover:bg-amber-50 dark:hover:bg-amber-950/40 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-3-3v6m-7 4h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                Add Poll
            </button>
        </div>
        <button id="postButton" class="bg-violet-600 hover:bg-violet-500 text-white text-xs font-mono font-medium px-5 py-2 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed" onclick="postToNostr()">
            <span id="postButtonText">Post to Nostr</span>
            <span id="postButtonLoading" class="hidden"><svg class="animate-spin -ml-1 h-3.5 w-3.5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Waiting for Signature...</span>
        </button>
    </div>
</div>
{% endif %}
