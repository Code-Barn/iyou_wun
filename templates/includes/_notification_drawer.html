{% load static %}
<div id="notification-drawer-backdrop" class="fixed inset-0 z-40 hidden bg-black/40 backdrop-blur-sm" onclick="closeNotificationDrawer()" aria-hidden="true"></div>

<aside id="notification-drawer"
       role="dialog"
       aria-label="Activity & Notifications"
       tabindex="-1"
       class="fixed inset-y-0 right-0 z-50 w-full sm:w-96 bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-2xl transform translate-x-full transition-transform duration-300 ease-out flex flex-col">

  <!-- Header -->
  <div class="flex items-center justify-between gap-2 px-4 py-3 border-b border-slate-200 dark:border-slate-800">
    <h2 class="text-sm font-semibold tracking-tight text-slate-800 dark:text-slate-100">ACTIVITY & NOTIFICATIONS</h2>
    <div class="flex items-center gap-2">
      <button type="button"
              class="text-[10px] font-mono uppercase tracking-wider text-violet-600 hover:text-violet-500 dark:text-violet-400 transition"
              onclick="markAllNotificationsRead()">Mark all as read</button>
      <button type="button"
              class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 font-mono text-sm transition"
              onclick="closeNotificationDrawer()"
              aria-label="Close notifications">✕</button>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div class="flex items-center gap-1 px-3 py-2 border-b border-slate-200 dark:border-slate-800 overflow-x-auto">
    <button type="button"
            class="notification-tab active flex items-center gap-1 whitespace-nowrap px-2.5 py-1 rounded-full text-xs font-mono transition"
            data-notify-tab="all"
            onclick="setNotificationFilter('all', this)">All</button>
    <button type="button"
            class="notification-tab flex items-center gap-1 whitespace-nowrap px-2.5 py-1 rounded-full text-xs font-mono transition"
            data-notify-tab="mentions"
            onclick="setNotificationFilter('mentions', this)">💬 Mentions</button>
    <button type="button"
            class="notification-tab flex items-center gap-1 whitespace-nowrap px-2.5 py-1 rounded-full text-xs font-mono transition"
            data-notify-tab="reactions"
            onclick="setNotificationFilter('reactions', this)">❤️ Reactions</button>
    <button type="button"
            class="notification-tab flex items-center gap-1 whitespace-nowrap px-2.5 py-1 rounded-full text-xs font-mono transition"
            data-notify-tab="zaps"
            onclick="setNotificationFilter('zaps', this)">⚡ Zaps</button>
  </div>

  <!-- Scrollable Notification List (client-rendered) -->
  <div id="notification-items-list" class="flex-1 overflow-y-auto px-2 py-2 space-y-1">
    <div class="text-center text-slate-400 font-mono text-xs py-8">Listening for activity…</div>
  </div>

  <!-- Footer -->
  <div class="p-3 border-t border-slate-200 dark:border-slate-800">
    <a href="{% url 'notifications' %}"
       class="flex items-center justify-center gap-1.5 w-full text-xs font-mono text-violet-600 hover:text-violet-500 dark:text-violet-400 py-2 rounded-lg hover:bg-violet-50 dark:hover:bg-violet-950/40 transition">
      [ View Full Ledger → ]
    </a>
  </div>
</aside>
