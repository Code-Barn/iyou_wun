{% load static %}
<!-- Canonical Gallery Lightbox — driven by static/js/gallery_player.js -->
<div id="lightbox-modal" class="fixed inset-0 z-50 hidden bg-black/85 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4" onclick="closeLightbox(event)">
  <div class="relative w-full max-w-4xl max-h-[92vh] flex flex-col bg-slate-950/95 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl" onclick="event.stopPropagation()">
    <!-- Caption Line -->
    <div class="px-4 py-2.5 border-b border-slate-800 flex items-center justify-between gap-2">
      <span id="lbCaption" class="text-xs font-mono text-slate-300 truncate min-w-0"></span>
      <button type="button" class="close-lb-btn flex-shrink-0 text-slate-400 hover:text-white text-lg leading-none transition" onclick="closeLightbox(event)" aria-label="Close">✕</button>
    </div>
    <!-- Media Pane -->
    <div id="lbMediaPane" class="flex-1 min-h-0 overflow-y-auto flex items-center justify-center p-3 sm:p-4"></div>
    <!-- Meta / Author / Navigation -->
    <div class="px-4 py-3 border-t border-slate-800 space-y-2">
      <div id="lbAuthor" class="flex items-center gap-2"></div>
      <div id="lbMeta" class="font-mono text-[11px] text-slate-400 space-y-1"></div>
      <div class="flex items-center justify-between gap-3">
        <button id="lbPrev" type="button" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-violet-700 text-violet-300 hover:text-white text-xs font-bold transition" onclick="navigateLightbox(-1)" style="display:none">← Prev</button>
        <span id="lbCounter" class="text-[10px] text-slate-500 font-mono"></span>
        <button id="lbNext" type="button" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-violet-700 text-violet-300 hover:text-white text-xs font-bold transition" onclick="navigateLightbox(1)" style="display:none">Next →</button>
      </div>
    </div>
  </div>
</div>
