  <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2">
    <!-- Top Row: Ecosystem Title & Close Trigger -->

              id="close-ecosystem-bar" 
              class="text-xs text-slate-400 hover:text-white px-2 py-0.5 rounded bg-slate-800/80 hover:bg-slate-700 transition" 
              onclick="closeEcosystemBar(event)">
        ✕ Close
      </button>
    </div>

    <!-- 19-App Links Flow -->
    <div class="flex flex-wrap items-center gap-x-3 gap-y-1.5 text-xs font-mono py-1">

      <span class="text-slate-700">/</span>
      <a href="https://name.iyou.me" class="text-teal-400 hover:text-teal-300">name</a>
      <span class="text-slate-700">/</span>
      <a href="https://hive.iyou.me" class="text-orange-400 hover:text-orange-300">hive</a>
      <span class="text-slate-700">/</span>
      <a href="https://ride.iyou.me" class="text-lime-400 hover:text-lime-300">ride</a>
      <span class="text-slate-700">/</span>
      <a href="https://dctech.iyou.me" class="text-indigo-400 hover:text-indigo-300">dctech</a>
      <span class="text-slate-700">/</span>
      <a href="https://safe.iyou.me" class="text-rose-400 hover:text-rose-300">safe</a>
      <span class="text-slate-700">/</span>
      <a href="https://talk.iyou.me" class="text-cyan-400 hover:text-cyan-300">talk</a>
      <span class="text-slate-700">/</span>
      <a href="https://clar.iyou.me" class="text-emerald-400 hover:text-emerald-300">clar</a>

  </div>

  <!-- Mobile Tap / Pull Handle (4px visible lip + centered pill) -->
  <div class="h-2 w-full bg-violet-500/80 cursor-pointer flex justify-center items-center select-none" onclick="toggleEcosystemBar(event)">
    <div class="w-8 h-1 bg-violet-300 rounded-full opacity-80"></div>
  </div>
</div>

<script>
  function openEcosystemBar() {
    const bar = document.getElementById('sovereign-ecosystem-topbar');
    if (!bar) return;
    bar.classList.remove('-translate-y-[calc(100%-4px)]');
    bar.classList.add('translate-y-0');
  }

  function closeEcosystemBar(e) {
    if (e) e.stopPropagation();
    const bar = document.getElementById('sovereign-ecosystem-topbar');
    if (!bar) return;
    bar.classList.remove('translate-y-0');
    bar.classList.add('-translate-y-[calc(100%-4px)]');
    if (document.activeElement) document.activeElement.blur();
  }

  function toggleEcosystemBar(e) {
    if (e) e.stopPropagation();
    const bar = document.getElementById('sovereign-ecosystem-topbar');
    if (!bar) return;
    if (bar.classList.contains('translate-y-0')) {
      closeEcosystemBar(e);
    } else {
      openEcosystemBar();
    }
  }
</script>
