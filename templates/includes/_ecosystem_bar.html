<script>
  window.IS_STAFF_ADMIN = {% if user.is_staff or request.user.is_staff %}true{% else %}false{% endif %};
  const ECOSYSTEM_REGISTRY = {"idp": {"slug": "idp", "url": "https://iyou.me", "status": "ACTIVE", "repo": "https://github.com/iyou-mesh/iyou_idp", "stack": "Django 6.0 / Rust did_rust / PostgreSQL / Redis", "mission": "Root Identity Provider & Sovereign Authentication", "color": "purple"}, "wun": {"slug": "wun", "url": "https://wun.iyou.me", "status": "ACTIVE", "repo": "https://github.com/iyou-mesh/iyou_wun", "stack": "Django 5.2 / Nostr NIP-01/10/65 / XMPP", "mission": "Social Hub & Sovereign Profile Space", "color": "violet"}, "poly": {"slug": "poly", "url": "https://poly.iyou.me", "status": "ACTIVE", "repo": "https://github.com/iyou-mesh/iyou_poly", "stack": "Django 6.0 / Pure-Python poly_engine / SSE", "mission": "Stateless Consensus Engine & Governance Ledger", "color": "purple"}, "name": {"slug": "name", "url": "https://name.iyou.me", "status": "ACTIVE", "repo": "https://github.com/iyou-mesh/iyou_name", "stack": "Django 6.0 / PyO3 Rust Chart Kernel / Wand", "mission": "Kinship Graph & Lineage Provenance Ledger", "color": "teal"}, "hive": {"slug": "hive", "url": "https://hive.iyou.me", "status": "BETA", "repo": "https://github.com/iyou-mesh/iyou_hive", "stack": "React 18 SPA / Vite / Django REST / LanceDB", "mission": "Communal Vaults & Legal Proofs", "color": "orange"}, "ride": {"slug": "ride", "url": "https://ride.iyou.me", "status": "DEV_WIP", "repo": "https://github.com/iyou-mesh/iyou_ride", "stack": "Django 5.2 / BIP-340 Schnorr / SSE", "mission": "Sovereign Transport & Auction Dispatch", "color": "lime"}, "dctech": {"slug": "dctech", "url": "https://dctech.iyou.me", "status": "DEV_WIP", "repo": "https://github.com/iyou-mesh/dc_tech_website", "stack": "Django 6.0 / WhiteNoise / Defensive Cyber-Grit", "mission": "Corporate Portal & Security Hardening", "color": "indigo"}, "safe": {"slug": "safe", "url": "https://safe.iyou.me", "status": "DEV_WIP", "repo": "https://github.com/iyou-mesh/iyou_safe", "stack": "Django 5.2 / Ed25519 / Crisis Triage", "mission": "Key Escrow & Emergency Recovery", "color": "rose"}, "talk": {"slug": "talk", "url": "https://talk.iyou.me", "status": "INCUBATING", "repo": "https://github.com/iyou-mesh/iyou_talk", "stack": "Django 5.2 / Prosody XMPP / Jitsi Meet", "mission": "P2P Encrypted Comms & Peer Support", "color": "cyan"}, "clar": {"slug": "clar", "url": "https://clar.iyou.me", "status": "INCUBATING", "repo": "https://github.com/iyou-mesh/iyou_clar", "stack": "Django 5.2 / SQLite / Attestation Ledger", "mission": "Verification & Auditing Ledger", "color": "emerald"}, "play": {"slug": "play", "url": "https://play.iyou.me", "status": "INCUBATING", "repo": "https://github.com/iyou-mesh/iyou_play", "stack": "Django 5.2 / Geohash / Athletic Coordination", "mission": "Athletics Master & Sovereign Events", "color": "amber"}, "blog": {"slug": "blog", "url": "https://blog.iyou.me", "status": "INCUBATING", "repo": "https://github.com/iyou-mesh/iyou_blog", "stack": "Django 6.0 / Blossom / Kind 30023 Markdown", "mission": "Censorship-Resistant Sovereign Publishing", "color": "sky"}, "help": {"slug": "help", "url": "https://help.iyou.me", "status": "INCUBATING", "repo": "https://github.com/iyou-mesh/iyou_help", "stack": "Django 6.0 / WhiteNoise / Diagnostic Reports", "mission": "Help, Documentation & User Guidance", "color": "red"}, "draw": {"slug": "draw", "url": "https://draw.iyou.me", "status": "BETA", "repo": "https://github.com/iyou-mesh/iyou_draw", "stack": "Django 5.2 / Konva Canvas / Blossom Media", "mission": "Visual Creation Studio", "color": "fuchsia"}, "life": {"slug": "life", "url": "https://life.iyou.me", "status": "DEV_WIP", "repo": "https://github.com/iyou-mesh/iyou_life", "stack": "Django 5.2 / Legacy Archive / SQLite", "mission": "Memorial & Sovereign Legacy Archive", "color": "sky"}, "walk": {"slug": "walk", "url": "https://walk.iyou.me", "status": "INCUBATING", "repo": "https://github.com/iyou-mesh/iyou_walk", "stack": "Django 5.2 / Pedestrian Mesh / Geohash", "mission": "Pedestrian Navigation & Sovereign Mesh", "color": "green"}, "stay": {"slug": "stay", "url": "https://stay.iyou.me", "status": "DEV_WIP", "repo": "https://github.com/iyou-mesh/iyou_stay", "stack": "Django 5.2 / Sovereign Spaces / SQLite", "mission": "Hospitality & Sovereign Spaces", "color": "yellow"}, "dev": {"slug": "dev", "url": "https://dev.iyou.me", "status": "INCUBATING", "repo": "https://github.com/iyou-mesh/iyou_dev", "stack": "Django 5.2 / Developer Portal / API Hub", "mission": "Mesh Operations & Developer Portal", "color": "zinc"}, "spot": {"slug": "spot", "url": "https://spot.iyou.me", "status": "DEV_WIP", "repo": "https://github.com/iyou-mesh/iyou_spot", "stack": "Django 5.2 / Discovery / Geolocation", "mission": "Local Geolocation & Community Discovery", "color": "pink"}, "baba": {"slug": "baba", "url": "https://baba.iyou.me", "status": "INCUBATING", "repo": "https://github.com/iyou-mesh/iyou_baba", "stack": "Django 5.2 / Sticker Vault & Foundry", "mission": "Sovereign Sticker Vault & Curation Foundry", "color": "blue"}};

  function openEcosystemModal(slug, e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    const meta = ECOSYSTEM_REGISTRY[slug];
    if (!meta) return;

    const modal = document.getElementById('ecosystem-intercept-modal');
    if (!modal) return;

    document.getElementById('eco-modal-slug').textContent = slug;
    document.getElementById('eco-modal-mission').textContent = meta.mission;
    document.getElementById('eco-modal-repo-link').href = meta.repo;
    document.getElementById('eco-modal-stack-text').textContent = meta.stack;

    const isIncubating = meta.status === 'INCUBATING';
    const headline = document.getElementById('eco-modal-headline');
    const badge = document.getElementById('eco-modal-badge');
    const statusText = document.getElementById('eco-modal-status-text');

    if (isIncubating) {
      headline.textContent = 'Seeking Sovereign Co-Developers';
      badge.textContent = 'INCUBATING';
      badge.className = 'px-1.5 py-0.5 rounded text-[10px] font-bold bg-teal-500/20 text-teal-400 dark:bg-teal-500/30 dark:text-teal-600 border border-teal-500/30';
      statusText.textContent = 'Incubating • Seeking Co-Developers';
    } else {
      headline.textContent = 'Under Sovereign Construction';
      badge.textContent = 'DEV_WIP';
      badge.className = 'px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/20 text-amber-400 dark:bg-amber-500/30 dark:text-amber-600 border border-amber-500/30';
      statusText.textContent = 'Under Active Sovereign Construction';
    }

    let targetUrl = meta.url;
    try {
      const host = window.location.hostname.toLowerCase();
      const match = host.match(/^([a-z0-9-]+(?:\.[a-z0-9-]+)*)\.(?:[a-z0-9_-]+)\.iyou\.me$/);
      if (match) {
        const scope = match[1];
        const reserved = ['api', 'admin', 'ws', 'relay', 'localhost', '127.0.0.1', 'auth', 'media', 'static', 'blossom'];
        if (!reserved.includes(scope) && slug !== 'idp' && slug !== 'dev') {
          targetUrl = 'https://' + scope + '.' + slug + '.iyou.me/';
        }
      }
    } catch (err) {}

    const adminContainer = document.getElementById('eco-modal-admin-container');
    if (adminContainer) {
      if (window.IS_STAFF_ADMIN) {
        adminContainer.innerHTML = `
          <span class="text-emerald-500 font-semibold flex items-center gap-1">
            <span>●</span> Staff / Admin Key Verified
          </span>
          <a href="${targetUrl}" class="text-violet-400 hover:text-violet-300 dark:text-violet-600 underline font-bold">
            Admin Bypass: Enter Node ↗
          </a>
        `;
      } else {
        adminContainer.innerHTML = `
          <span class="text-slate-500 dark:text-slate-400 italic">Admin Key required for early access</span>
          <a href="https://iyou.me/" class="text-slate-400 hover:text-slate-200 dark:text-slate-600 dark:hover:text-slate-900 underline font-bold">
            Authenticate 🔑
          </a>
        `;
      }
    }

    const bar = document.getElementById('sovereign-ecosystem-topbar');
    if (bar) {
      bar.style.transform = 'none';
    }
    modal.classList.remove('hidden');
  }

  function closeEcosystemModal(e) {
    if (e) e.stopPropagation();
    const modal = document.getElementById('ecosystem-intercept-modal');
    if (modal) modal.classList.add('hidden');
    const bar = document.getElementById('sovereign-ecosystem-topbar');
    if (bar) {
      bar.style.transform = '';
    }
  }

  function handleModalBackdropClick(e) {
    if (e.target.id === 'ecosystem-intercept-modal') {
      closeEcosystemModal();
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      closeEcosystemModal();
    }
  });

  window.openEcosystemModal = openEcosystemModal;
  window.closeEcosystemModal = closeEcosystemModal;
  window.handleModalBackdropClick = handleModalBackdropClick;

  function openEcosystemBar() {
    const bar = document.getElementById('sovereign-ecosystem-topbar');
    if (!bar) return;
    bar.classList.remove('-translate-y-[calc(100%-4px)]');
    bar.classList.add('translate-y-0');
  }

  function closeEcosystemBar(e) {
    if (e) e.stopPropagation();
    const modal = document.getElementById('ecosystem-intercept-modal');
    if (modal && !modal.classList.contains('hidden')) return;
    const bar = document.getElementById('sovereign-ecosystem-topbar');
    if (!bar) return;
    bar.classList.remove('translate-y-0');
    bar.classList.add('-translate-y-[calc(100%-4px)]');
    if (document.activeElement) document.activeElement.blur();
  }

  function toggleEcosystemBar(e) {
    if (e) e.stopPropagation();
    const bar = document.getElementById('sovereign-ecosystem-topbar');
    if (!bar) return;
    if (bar.classList.contains('translate-y-0')) {
      closeEcosystemBar(e);
    } else {
      openEcosystemBar();
    }
  }

  (function initEcosystemScopePreservation() {
    try {
      const host = window.location.hostname.toLowerCase();
      const match = host.match(/^([a-z0-9-]+(?:\.[a-z0-9-]+)*)\.(?:[a-z0-9_-]+)\.iyou\.me$/);
      if (!match) return;
      const scope = match[1];
      const reserved = ['api', 'admin', 'ws', 'relay', 'localhost', '127.0.0.1', 'auth', 'media', 'static', 'blossom'];
      if (reserved.includes(scope)) return;

      const applyScopeToAnchors = () => {
        const bar = document.getElementById('sovereign-ecosystem-topbar');
        if (!bar) return;
        const anchors = bar.querySelectorAll('a[data-app-slug]');
        anchors.forEach(a => {
          const targetSlug = a.getAttribute('data-app-slug');
          if (!targetSlug || targetSlug === 'idp' || targetSlug === 'dev') return;
          a.href = 'https://' + scope + '.' + targetSlug + '.iyou.me/';
        });
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', applyScopeToAnchors);
      } else {
        applyScopeToAnchors();
      }
    } catch (e) {}
  })();
</script>
