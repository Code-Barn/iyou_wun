<div class="space-y-6">
  <div>
    <h2 class="text-sm font-mono font-bold uppercase tracking-wider text-slate-900 dark:text-slate-100 mb-1">Sovereign Switchboard</h2>
    <p class="text-xs text-slate-500 dark:text-slate-400">Manage your connected Nostr relays. Notes and profile updates are broadcasted across all active relays.</p>
  </div>

  <div id="relayList" class="space-y-2">
    {% for relay in relay_objs %}
    <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg px-3.5 py-2 gap-3"
         data-relay-row="{{ relay.url }}">
      <span class="text-xs font-mono text-slate-700 dark:text-slate-300 break-all flex items-center gap-2 min-w-0">
        <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
        <span class="truncate">{{ relay.url }}</span>
      </span>
      <div class="flex items-center gap-2.5 flex-shrink-0">
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox"
                 class="sr-only peer relay-toggle-checkbox"
                 data-relay-url="{{ relay.url }}"
                 {% if relay.enabled != False %}checked{% endif %}
                 onchange="toggleRelayState('{{ relay.url|escapejs }}', this.checked)">
          <div class="w-8 h-4 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all dark:border-slate-600 peer-checked:bg-violet-600"></div>
        </label>
        <button type="button" onclick="removeRelay('{{ relay.url|escapejs }}')"
                class="text-rose-500 hover:text-rose-600 text-xs font-mono font-medium flex-shrink-0">
          Remove
        </button>
      </div>
    </div>
    {% empty %}
    <div class="text-center text-slate-400 text-xs font-mono py-4">No relays configured.</div>
    {% endfor %}
  </div>

  <div class="flex flex-wrap items-center gap-2 pt-2">
    <input type="text" id="relayInput" placeholder="wss://relay.example.com"
           class="flex-1 min-w-[220px] bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-lg p-2.5 text-xs font-mono text-slate-900 dark:text-slate-100 focus:outline-none focus:border-violet-500" />
    <button type="button" onclick="addRelay()"
            class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 text-xs font-mono font-medium px-4 py-2.5 rounded-lg border border-slate-200 dark:border-slate-700 transition-colors flex-shrink-0">
      Add Relay
    </button>
  </div>

  <div class="flex items-center gap-3 pt-2">
    <button type="button" onclick="saveRelays()"
            class="bg-violet-600 hover:bg-violet-500 text-white text-xs font-mono font-semibold px-5 py-2.5 rounded-lg transition-colors shadow-sm">
      Save Relays
    </button>
    <span id="relayStatus" class="text-xs font-mono text-slate-400 hidden"></span>
  </div>
</div>
